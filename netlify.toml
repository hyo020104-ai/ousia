# 정적 사이트 — 빌드 과정 없음. 저장소 루트를 그대로 내보낸다.
[build]
  publish = "."
  command = ""

# 사진은 파일명이 바뀌지 않으면 내용도 안 바뀐다 — 1년 캐시
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 본체는 늘 최신으로
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
